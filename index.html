<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store,max-age=0"><title>News Monitor v5</title>
<style>
:root{--bg:#090c10;--panel:#11161c;--panel2:#171d24;--line:#29323c;--text:#f2f5f7;--muted:#94a0ab;--live:#51c878}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}body{overflow:hidden}.app{height:100%;display:flex;flex-direction:column}.topbar{height:48px;flex:0 0 48px;display:flex;align-items:center;gap:10px;padding:6px 10px;background:#0d1116;border-bottom:1px solid var(--line)}.brand{font-weight:750;letter-spacing:.06em;font-size:14px;margin-right:6px;white-space:nowrap}.segment{display:flex;border:1px solid #36404b;border-radius:9px;overflow:hidden}.segment button,.toolbtn{border:0;background:#171d24;color:#cbd2d8;padding:7px 11px;font-size:12px;cursor:pointer}.segment button+button{border-left:1px solid #36404b}.segment button.active{background:#e7ebef;color:#101419}.toolbtn{border:1px solid #36404b;border-radius:9px}.spacer{flex:1}.counter{font-size:12px;color:var(--muted)}.grid{flex:1;min-height:0;padding:8px;display:grid;gap:8px}.layout-4{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}.layout-6{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}.layout-9{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}.tile{min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}.tilehead{height:34px;flex:0 0 34px;display:flex;align-items:center;gap:7px;padding:0 7px 0 10px;background:#141a20;border-bottom:1px solid var(--line);font-size:12px}.titlename{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.country{color:var(--muted);white-space:nowrap}.state{font-size:10px;color:var(--muted)}.state.live{color:var(--live)}.tileactions{margin-left:auto;display:flex;gap:4px}.mini{border:1px solid #36404b;background:#1a2129;color:#d7dde2;border-radius:6px;min-width:27px;height:24px;padding:0 6px;cursor:pointer}.player{position:relative;flex:1;min-height:0;background:#000}.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.empty,.offline{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;color:#aab4bc;text-align:center;padding:20px;font-size:12px}.openofficial{display:inline-block;text-decoration:none;color:#fff;border:1px solid #46515d;background:#1b232c;border-radius:7px;padding:6px 10px;font-size:11px}.focus .tile{display:none}.focus .tile.active{display:flex;grid-column:1/-1;grid-row:1/-1}.drawerback{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:20;display:none}.drawerback.open{display:block}.drawer{position:absolute;right:0;top:0;width:min(430px,92vw);height:100%;background:#10151b;border-left:1px solid var(--line);display:flex;flex-direction:column}.drawerhead{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}.search{margin:10px 12px 5px;width:calc(100% - 24px);background:#0b0f14;border:1px solid #35404b;color:#fff;border-radius:8px;padding:9px 10px;outline:none}.library{overflow:auto;padding:6px 12px 20px}.group{margin:12px 0 6px;color:#9aa6b0;font-size:11px;font-weight:700;letter-spacing:.08em}.chrow{display:flex;align-items:center;gap:9px;padding:8px 6px;border-bottom:1px solid #202830}.chrow input{width:18px;height:18px}.chmeta{min-width:0;flex:1}.chname{font-size:13px}.chsub{font-size:10px;color:#7f8c97;margin-top:2px}.badge{font-size:9px;border:1px solid #3b4652;border-radius:10px;padding:2px 6px;color:#aeb8c0}.drawerfoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:8px}.drawerfoot span{font-size:11px;color:var(--muted)}.drawerfoot button{margin-left:auto}@media(max-width:720px){.brand{display:none}.counter{display:none}.topbar{gap:6px}.segment button,.toolbtn{padding:7px 8px}}
</style></head><body><div class="app"><header class="topbar"><div class="brand">NEWS MONITOR</div><div class="segment" id="layoutButtons"><button data-layout="4">4 格</button><button data-layout="6">6 格</button><button data-layout="9">9 格</button></div><button class="toolbtn" id="libraryBtn">頻道庫</button><button class="toolbtn" id="muteBtn">全部靜音</button><div class="spacer"></div><div class="counter" id="counter"></div></header><main class="grid" id="grid"></main></div>
<div class="drawerback" id="drawerback"><aside class="drawer" onclick="event.stopPropagation()"><div class="drawerhead"><strong>選擇監看頻道</strong><span class="spacer"></span><button class="toolbtn" id="closeDrawer">關閉</button></div><input class="search" id="search" placeholder="搜尋頻道、國家…"><div class="library" id="library"></div><div class="drawerfoot"><span id="selectedCount"></span><button class="toolbtn" id="doneBtn">完成</button></div></aside></div>
<script>
const KEY='newsMonitorV5Settings',DEFAULT={layout:6,selected:['abc-au','cnn','cctv13','global','tbs','cctv7']};let settings=JSON.parse(localStorage.getItem(KEY)||'null')||DEFAULT,channels=[],streams={};const grid=document.getElementById('grid'),drawerback=document.getElementById('drawerback'),library=document.getElementById('library'),counter=document.getElementById('counter');
const save=()=>localStorage.setItem(KEY,JSON.stringify(settings));const byId=id=>channels.find(c=>c.id===id);const visibleIds=()=>settings.selected.slice(0,settings.layout);const esc=(s='')=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function youtubeFrame(ch){const s=streams[ch.id];if(!s||s.status!=='live'||!s.video_id)return '<div class="offline"><div>目前沒有偵測到可公開嵌入的直播訊號</div><div>系統每小時重新檢查</div></div>';const src=`https://www.youtube.com/embed/${encodeURIComponent(s.video_id)}?autoplay=1&mute=1&playsinline=1&rel=0&origin=${encodeURIComponent(location.origin)}`;return `<iframe src="${src}" title="${esc(ch.name)}" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`}
function externalFrame(ch){return `<div class="offline"><div>${esc(ch.name)}</div><div>此頻道採官方網站外開模式</div><a class="openofficial" href="${ch.official_url}" target="_blank" rel="noopener">開啟官方直播</a></div>`}
function render(){grid.className=`grid layout-${settings.layout}`;grid.innerHTML='';const ids=visibleIds();for(let i=0;i<settings.layout;i++){const id=ids[i];if(!id){const t=document.createElement('section');t.className='tile';t.innerHTML='<div class="player"><div class="empty">空白頻道<br>從「頻道庫」加入</div></div>';grid.appendChild(t);continue}const ch=byId(id);if(!ch)continue;const tile=document.createElement('section');tile.className='tile';tile.dataset.id=id;tile.draggable=true;let state=ch.source==='youtube'?((streams[id]&&streams[id].status==='live')?'<span class="state live">● LIVE</span>':'<span class="state">○ OFFLINE</span>'):'<span class="state">↗ 官方</span>';tile.innerHTML=`<div class="tilehead"><span class="titlename">${esc(ch.name)}</span><span class="country">${esc(ch.country||'')}</span>${state}<div class="tileactions"><button class="mini left">←</button><button class="mini right">→</button><button class="mini focusbtn">⛶</button></div></div><div class="player">${ch.source==='youtube'?youtubeFrame(ch):externalFrame(ch)}</div>`;tile.querySelector('.left').onclick=()=>move(id,-1);tile.querySelector('.right').onclick=()=>move(id,1);tile.querySelector('.focusbtn').onclick=()=>toggleFocus(tile);tile.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',id));tile.addEventListener('dragover',e=>e.preventDefault());tile.addEventListener('drop',e=>{e.preventDefault();reorder(e.dataTransfer.getData('text/plain'),id)});grid.appendChild(tile)}counter.textContent=`已選 ${settings.selected.length} / 9`;document.querySelectorAll('#layoutButtons button').forEach(b=>b.classList.toggle('active',Number(b.dataset.layout)===settings.layout))}
function move(id,d){const a=settings.selected,i=a.indexOf(id),j=i+d;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}function reorder(from,to){const a=settings.selected,i=a.indexOf(from),j=a.indexOf(to);if(i<0||j<0||i===j)return;a.splice(i,1);a.splice(j,0,from);save();render()}function toggleFocus(tile){if(grid.classList.contains('focus')){grid.classList.remove('focus');tile.classList.remove('active')}else{document.querySelectorAll('.tile').forEach(t=>t.classList.remove('active'));tile.classList.add('active');grid.classList.add('focus')}}function setLayout(n){settings.layout=n;save();render()}
function renderLibrary(filter=''){const q=filter.trim().toLowerCase();library.innerHTML='';[...new Set(channels.map(c=>c.group))].forEach(g=>{const list=channels.filter(c=>c.group===g&&(!q||`${c.name} ${c.country} ${c.group}`.toLowerCase().includes(q)));if(!list.length)return;const h=document.createElement('div');h.className='group';h.textContent=g;library.appendChild(h);list.forEach(ch=>{const row=document.createElement('label');row.className='chrow';const checked=settings.selected.includes(ch.id);row.innerHTML=`<input type="checkbox" ${checked?'checked':''}><div class="chmeta"><div class="chname">${esc(ch.name)}</div><div class="chsub">${esc(ch.country)}</div></div><span class="badge">${ch.source==='youtube'?'YouTube':'官方外開'}</span>`;const box=row.querySelector('input');box.onchange=()=>{if(box.checked){if(settings.selected.length>=9){box.checked=false;alert('最多只能選 9 個頻道');return}settings.selected.push(ch.id)}else settings.selected=settings.selected.filter(x=>x!==ch.id);save();updateSelectedCount()};library.appendChild(row)})});updateSelectedCount()}function updateSelectedCount(){document.getElementById('selectedCount').textContent=`已選 ${settings.selected.length} / 9`}
document.querySelectorAll('#layoutButtons button').forEach(b=>b.onclick=()=>setLayout(Number(b.dataset.layout)));document.getElementById('libraryBtn').onclick=()=>{drawerback.classList.add('open');renderLibrary(document.getElementById('search').value)};document.getElementById('closeDrawer').onclick=()=>drawerback.classList.remove('open');document.getElementById('doneBtn').onclick=()=>{drawerback.classList.remove('open');render()};drawerback.onclick=()=>drawerback.classList.remove('open');document.getElementById('search').oninput=e=>renderLibrary(e.target.value);document.getElementById('muteBtn').onclick=()=>document.querySelectorAll('iframe').forEach(f=>{try{f.contentWindow.postMessage('{"event":"command","func":"mute","args":""}','*')}catch(e){}});
Promise.all([fetch('./channels.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('./streams.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).catch(()=>({}))]).then(([c,s])=>{channels=c.channels||[];streams=s||{};settings.selected=settings.selected.filter(id=>channels.some(c=>c.id===id)).slice(0,9);if(!settings.selected.length)settings.selected=[...DEFAULT.selected];save();render()}).catch(err=>{console.error(err);grid.innerHTML='<div class="offline">News Monitor 載入失敗，請開啟瀏覽器主控台查看錯誤</div>'});
</script></body></html>
