<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>News Monitor</title>
  <style>
    :root{
      --bg:#0b0d10;
      --panel:#11151a;
      --line:#2a3138;
      --text:#f3f5f7;
      --muted:#9ca7b1;
      --accent:#e53935;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
      overflow:hidden;
    }
    body{
      padding:8px;
    }
    .grid{
      width:100%;
      height:100%;
      display:grid;
      grid-template-columns:1fr 1fr;
      grid-template-rows:1fr 1fr;
      gap:8px;
    }
    .card{
      position:relative;
      min-width:0;
      min-height:0;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:12px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .bar{
      height:38px;
      flex:0 0 38px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 10px 0 12px;
      background:#14191f;
      border-bottom:1px solid var(--line);
      font-size:14px;
    }
    .name{
      display:flex;
      align-items:center;
      gap:8px;
      font-weight:650;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .country{
      color:var(--muted);
      font-weight:500;
    }
    .actions{
      display:flex;
      gap:6px;
    }
    button{
      appearance:none;
      border:1px solid #3a424c;
      background:#1c232b;
      color:var(--text);
      border-radius:8px;
      padding:5px 9px;
      font-size:12px;
      cursor:pointer;
    }
    button:active{transform:scale(.98)}
    .player{
      position:relative;
      flex:1 1 auto;
      min-height:0;
      background:#000;
    }
    iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      background:#000;
    }
    .note{
      position:absolute;
      left:10px;
      bottom:8px;
      z-index:5;
      font-size:11px;
      color:#d8dee5;
      background:rgba(0,0,0,.58);
      padding:5px 7px;
      border-radius:6px;
      pointer-events:none;
    }
    .focus .card{display:none}
    .focus .card.active{
      display:flex;
      grid-column:1 / -1;
      grid-row:1 / -1;
    }
    @media (orientation:portrait){
      body{overflow:auto}
      .grid{
        height:auto;
        min-height:100%;
        grid-template-columns:1fr;
        grid-template-rows:repeat(4,minmax(280px,1fr));
      }
      .focus .card.active{
        min-height:calc(100vh - 16px);
      }
    }
  </style>
</head>
<body>
  <main class="grid" id="grid">

    <section class="card">
      <div class="bar">
        <div class="name">ABC News <span class="country">Australia</span></div>
        <div class="actions"><button onclick="toggleFocus(this)">放大</button></div>
      </div>
      <div class="player">
        <iframe
          src="https://www.youtube.com/embed/live_stream?channel=UCVgO39Bk5sMo66-6o6Spn6Q&autoplay=1&mute=1&playsinline=1"
          title="ABC News Australia"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </section>

    <section class="card">
      <div class="bar">
        <div class="name">NBC News NOW <span class="country">United States</span></div>
        <div class="actions"><button onclick="toggleFocus(this)">放大</button></div>
      </div>
      <div class="player">
        <iframe
          src="https://www.youtube.com/embed/live_stream?channel=UCeY0bbntWzzVIaj2z3QigXg&autoplay=1&mute=1&playsinline=1"
          title="NBC News NOW"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </section>

    <section class="card">
      <div class="bar">
        <div class="name">寰宇新聞 <span class="country">Taiwan</span></div>
        <div class="actions"><button onclick="toggleFocus(this)">放大</button></div>
      </div>
      <div class="player">
        <iframe
          src="https://www.youtube.com/embed/live_stream?channel=UCp2f7tGJGN6R9Muxipem8Nw&autoplay=1&mute=1&playsinline=1"
          title="寰宇新聞"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </section>

    <section class="card">
      <div class="bar">
        <div class="name">TBS NEWS DIG <span class="country">Japan</span></div>
        <div class="actions"><button onclick="toggleFocus(this)">放大</button></div>
      </div>
      <div class="player">
        <iframe
          src="https://www.youtube.com/embed/live_stream?channel=UC6AG81pAkf6Lbi_1VC5NmPA&autoplay=1&mute=1&playsinline=1"
          title="TBS NEWS DIG"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </section>

  </main>

  <script>
    function toggleFocus(btn){
      const grid = document.getElementById('grid');
      const card = btn.closest('.card');
      const isFocused = grid.classList.contains('focus');

      if(isFocused){
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        grid.classList.remove('focus');
        document.querySelectorAll('button').forEach(b => b.textContent='放大');
      }else{
        card.classList.add('active');
        grid.classList.add('focus');
        btn.textContent='四格';
      }
    }
  </script>
</body>
</html>
