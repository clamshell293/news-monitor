<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<title>News Monitor</title>
<style>
:root{--bg:#0b0d10;--panel:#11151a;--line:#2a3138;--text:#f3f5f7;--muted:#9ca7b1}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;overflow:hidden}
body{padding:8px}
.grid{width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px}
.card{position:relative;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.bar{height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 12px;background:#14191f;border-bottom:1px solid var(--line);font-size:14px}
.name{display:flex;align-items:center;gap:8px;font-weight:650}
.country{color:var(--muted);font-weight:500}
button{appearance:none;border:1px solid #3a424c;background:#1c232b;color:var(--text);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer}
.player{position:relative;flex:1 1 auto;min-height:0;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#b8c0c7;padding:26px;line-height:1.6}
.focus .card{display:none}
.focus .card.active{display:flex;grid-column:1/-1;grid-row:1/-1}
@media (orientation:portrait){
  body{overflow:auto}
  .grid{height:auto;min-height:100%;grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(280px,1fr))}
  .focus .card.active{min-height:calc(100vh - 16px)}
}
</style>
</head>
<body>
<main class="grid" id="grid">
  <section class="card" data-key="abc">
    <div class="bar"><div class="name">ABC News <span class="country">Australia</span></div><button onclick="toggleFocus(this)">放大</button></div>
    <div class="player"></div>
  </section>

  <section class="card" data-key="cnn">
    <div class="bar"><div class="name">CNN <span class="country">United States</span></div><button onclick="toggleFocus(this)">放大</button></div>
    <div class="player"></div>
  </section>

  <section class="card" data-key="global">
    <div class="bar"><div class="name">寰宇新聞 <span class="country">Taiwan</span></div><button onclick="toggleFocus(this)">放大</button></div>
    <div class="player"></div>
  </section>

  <section class="card" data-key="tbs">
    <div class="bar"><div class="name">TBS NEWS DIG <span class="country">Japan</span></div><button onclick="toggleFocus(this)">放大</button></div>
    <div class="player"></div>
  </section>
</main>

<script>
function toggleFocus(btn){
  const grid=document.getElementById('grid');
  const card=btn.closest('.card');
  const focused=grid.classList.contains('focus');

  if(focused){
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
    grid.classList.remove('focus');
    document.querySelectorAll('button').forEach(b=>b.textContent='放大');
  }else{
    card.classList.add('active');
    grid.classList.add('focus');
    btn.textContent='四格';
  }
}

fetch('./streams.json?t=' + Date.now(), {cache:'no-store'})
.then(r=>r.json())
.then(data=>{
  document.querySelectorAll('.card').forEach(card=>{
    const key=card.dataset.key;
    const p=card.querySelector('.player');
    const item=data[key];

    if(item && item.video_id && (item.status === 'live' || item.status === 'fallback')){
      const src=`https://www.youtube.com/embed/${item.video_id}?autoplay=1&mute=1&playsinline=1&rel=0&origin=${encodeURIComponent(location.origin)}`;
      p.innerHTML=`<iframe src="${src}" title="${item.title||key}" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
    }else{
      const msg = key === 'cnn'
        ? 'CNN 目前沒有偵測到官方公開 YouTube 直播。<br>系統會每 30 分鐘重新檢查。'
        : '目前沒有偵測到可用直播訊號。<br>系統會每 30 分鐘重新檢查。';
      p.innerHTML=`<div class="placeholder">${msg}</div>`;
    }
  });
})
.catch(()=>{
  document.querySelectorAll('.player').forEach(
    p=>p.innerHTML='<div class="placeholder">無法讀取 streams.json</div>'
  );
});
</script>
</body>
</html>
